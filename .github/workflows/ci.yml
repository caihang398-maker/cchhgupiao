name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: local
      AUTH_ENABLED: "false"
      PYTHONUTF8: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-server.txt

      - name: Compile source
        run: python -m compileall -q app.py dashboard.py stock_quant pages scripts

      - name: Run tests
        run: python -m unittest discover -s tests -v
